server:
  port: 8080

spring:
  application:
    name: api-gateway

  config:
    import: configserver:http://localhost:8888

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # ---------- AUTH SERVICE (PUBLIC) ----------
        - id: auth-service
          uri: lb://authservice
          predicates:
            - Path=/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info